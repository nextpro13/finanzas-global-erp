# Entorno local completo. Secretos en archivo .env (NO se versiona; ver .env.example)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: divisas
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports: ["5432:5432"]
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD}
    ports: ["5672:5672", "15672:15672"]
  ms-cambio-divisas:
    build: .
    depends_on: [postgres, rabbitmq]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_JPA_HIBERNATE_DDL_AUTO: update   # solo entorno local (en prod: Flyway)
      DB_URL: jdbc:postgresql://postgres:5432/divisas
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      RABBIT_HOST: rabbitmq
      RABBIT_USER: ${RABBIT_USER}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      APP_DEMO_PASSWORD: ${APP_DEMO_PASSWORD}
      CLIENTES_MODO: local
    ports: ["8082:8082"]
